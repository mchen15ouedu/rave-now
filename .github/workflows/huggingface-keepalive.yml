name: Hugging Face hourly health checks

on:
  schedule:
    # Avoid the start-of-hour congestion noted in GitHub's scheduling docs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: huggingface-keepalive
  cancel-in-progress: false

jobs:
  ping:
    if: ${{ vars.HF_SPACE_URL != '' || vars.HF_INPUT_ANALYSIS_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wake configured Spaces and verify health
        env:
          HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
          HF_INPUT_ANALYSIS_URL: ${{ vars.HF_INPUT_ANALYSIS_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def check(item):
              label, raw = item
              try:
                  url = urlsplit(raw)
                  valid = (url.scheme == 'https'
                           and re.fullmatch(r'[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.hf\.space', url.hostname or '')
                           and url.port in (None, 443)
                           and not url.username and not url.password
                           and url.path in ('', '/')
                           and not url.query and not url.fragment)
              except ValueError:
                  valid = False
              if not valid:
                  print(f'{label}: invalid public Space origin configuration.')
                  return False
              opener = build_opener(NoRedirects())
              request = Request(f'{raw.rstrip("/")}/healthz', headers={
                  'User-Agent': 'RaveNow-HealthCheck/1.0',
                  'Cache-Control': 'no-cache', 'Accept': 'application/json',
              })
              deadline = time.monotonic() + 45
              for attempt in range(1, 5):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  try:
                      with opener.open(request, timeout=min(8, remaining)) as response:
                          data = json.loads(response.read(4096))
                          if response.status == 200 and isinstance(data, dict) and data.get('ok') is True:
                              print(f'{label}: awake and healthy.')
                              return True
                  except HTTPError as error:
                      print(f'{label}: HTTP {error.code}.')
                  except (URLError, TimeoutError, OSError, ValueError):
                      print(f'{label}: health check unavailable or invalid.')
                  if attempt < 4 and time.monotonic() + 2 < deadline:
                      time.sleep(2)
              return False

          spaces = [(label, os.environ.get(key, '').strip()) for label, key in
                    [('Browser', 'HF_SPACE_URL'), ('Input analysis', 'HF_INPUT_ANALYSIS_URL')]
                    if os.environ.get(key, '').strip()]
          with ThreadPoolExecutor(max_workers=2) as pool:
              results = list(pool.map(check, spaces))
          if not all(results):
              sys.exit('A Space did not become healthy. Inspect its status or rerun manually.')
          PY
